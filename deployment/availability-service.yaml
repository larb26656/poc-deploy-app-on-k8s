apiVersion: apps/v1
kind: Deployment
metadata:
  name: availability-service
  namespace: poc-deploy-app-on-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: availability-service
  template:
    metadata:
      labels:
        app: availability-service
    spec:
      containers:
        - name: availability-service
          image: errortime/availability-service:0.0.1
          ports:
            - containerPort: 43118
          env:
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: 43118
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 43118
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: availability-service
  namespace: poc-deploy-app-on-k8s
spec:
  type: ClusterIP
  selector:
    app: availability-service
  ports:
    - name: http
      port: 43118
      targetPort: 43118
